# Custom IAM Role: HR Manager
# Full CRUD access to Employees, Attendance, Contracts, Working Schedules and
# Time Off modules. Approve/refuse Time Off requests. No access to payroll features.
#
# Apply with:
#   gcloud iam roles create hrManager \
#     --project=PROJECT_ID \
#     --file=gcp/iam/roles/hrManager.yaml
#
# The application-level permission matrix in src/services/iamService.js is the
# authoritative fine-grained enforcer for HR & Payroll modules. These GCP
# permissions gate the underlying GCP resources (Cloud Run, Firestore, etc.).

title: "HR Manager"
description: >-
  Full CRUD access to Employees, Attendance, Contracts, Working Schedules and
  Time Off modules. Can approve/refuse Time Off requests. No access to payroll
  features.
stage: GA
includedPermissions:
  - resourcemanager.projects.get
  - iam.roles.get
  - run.services.invoke
  - cloudfunctions.functions.invoke
  - secretmanager.versions.access
  - firestore.databases.get
  - firestore.documents.get
  - firestore.documents.list
  - firestore.documents.create
  - firestore.documents.update
  - firestore.documents.delete