version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: peoplepay360-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: peoplepay360_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: peoplepay360-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: peoplepay360-server
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/peoplepay360_db?schema=public
      JWT_SECRET: super-secret-key-32-chars-minimum-length
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: peoplepay360-mcp-server
    environment:
      MCP_SERVER_PORT: 3001
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/peoplepay360_db?schema=public
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: peoplepay360-agent
    environment:
      AGENT_PORT: 3002
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/peoplepay360_db?schema=public
      GEMINI_API_KEY: mock-gemini-key
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: peoplepay360-worker
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/peoplepay360_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
